[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavewright"
version = "0.1.0"
description = "Tools for cleaning and preparing audio datasets"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
wavewright = "wavewright.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
